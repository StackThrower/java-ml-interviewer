services:
  app:
    image: ghcr.io/stackthrower/java-ml-interviewer:latest
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      INTERVIEW_DURATION_SEC: ${INTERVIEW_DURATION_SEC:-600}
    ports:
      - "3001:3000"
